{% extends 'base.html' %}
{% block content %}
<h5>👥 All Users</h5>
<div class="table-responsive">
  <table class="table table-hover">
    <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Joined</th><th>RL Model</th></tr></thead>
    <tbody>
    {% for user in users %}
    <tr>
      <td>{{ user.id }}</td>
      <td>{{ user.username }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.created_at.strftime('%Y-%m-%d') }}</td>
      <td><a href="/admin/users/{{ user.id }}/rl" class="btn btn-info btn-sm">🤖 View AI Model</a></td>
    </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
