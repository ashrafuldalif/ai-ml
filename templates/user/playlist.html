{% extends 'base.html' %}
{% block content %}
<div class="row mt-3">
  <div class="col-12">
    <h4>❤️ My Liked Playlist</h4>
    <div class="row">
      {% for song in songs %}
      <div class="col-md-3 mb-3">
        <div class="card song-card h-100">
          <div class="card-body text-center">
            <div class="song-cover-placeholder">🎵</div>
            <h6 class="mt-2">{{ song.title }}</h6>
            <p class="text-muted small">{{ song.artist }}</p>
            <span class="badge bg-secondary">{{ song.genre.name if song.genre else 'Unknown' }}</span>
          </div>
        </div>
      </div>
      {% else %}
      <div class="col-12 text-center text-muted py-5">
        <h5>No liked songs yet! Like songs while playing to build your playlist.</h5>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
